# Render Blueprint: free web service. The JSON store lives on the instance's disk,
# so the demo data resets whenever the service restarts or redeploys.
services:
  - type: web
    name: bugpay
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # sandbox app > Webhooks: https://<this service>.onrender.com/api/webhooks/paypal, payout events; paste its id
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # hosted demo: paying, approving, the rules, the agent and Reset demo ask for this
      - key: STUDIO_PASSCODE
        sync: false
